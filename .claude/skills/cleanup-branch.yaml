name: cleanup-branch
description: Clean up merged feature branches
instructions: |
  This skill helps you clean up feature branches after they've been merged to main.

  Safety checks:
  1. Confirm the branch has been merged to main
  2. Ensure you're not currently on the branch to be deleted
  3. Verify with user before deleting

  Steps:
  1. Run: git checkout main
  2. Run: git pull origin main
  3. List merged branches: git branch --merged main | grep -v "main"
  4. Ask user which branch to delete (or show list)
  5. Delete local: git branch -d {branch-name}
  6. Optionally delete remote: git push origin --delete {branch-name}
  7. Show remaining branches: git branch -a

  Notes:
  - Use -d (safe delete) not -D (force delete)
  - Only delete branches that are fully merged
  - Keep main, and any WIP branches
