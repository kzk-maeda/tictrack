name: create-pr
description: Create a Pull Request to main with proper format
instructions: |
  This skill helps you create a well-formatted Pull Request following the project's standards.

  Before creating PR:
  1. Ensure all changes are committed
  2. Push the current branch to origin
  3. Check that tests, lint, and build pass locally

  PR format:
  ```
  Title: Step {N}: {Brief description}

  Body:
  ## 実装内容
  - {Change 1}
  - {Change 2}
  - {Change 3}

  ## テスト
  - ✅ {N} tests passing
  - ✅ Build successful
  - ✅ Lint passing

  ## 検証方法
  {How to verify the changes}
  ```

  Steps:
  1. Get current branch name
  2. Run: git push origin {branch-name}
  3. Run: gh pr create --title "{title}" --body "{body}"
  4. Show the PR URL
  5. Remind: CI will run automatically. Wait for all checks to pass before merging.
