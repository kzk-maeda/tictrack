name: sync-main
description: Sync local main with remote and update current branch
instructions: |
  This skill helps you keep your local main branch and current feature branch in sync with remote.

  Use cases:
  - After a PR is merged to main
  - Before starting new work
  - To resolve conflicts with main

  Steps:
  1. Save current branch name
  2. Run: git checkout main
  3. Run: git pull origin main
  4. If there was a feature branch, ask user if they want to:
     a) Return to feature branch: git checkout {branch-name}
     b) Update feature branch with main: git checkout {branch-name} && git merge main
     c) Stay on main (for starting new work)
  5. Show git status and confirm

  Notes:
  - If merge conflicts occur, guide the user through resolution
  - Remind to run npm install if package.json was updated
