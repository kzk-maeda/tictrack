name: start-feature
description: Start a new feature branch from main
instructions: |
  This skill helps you start a new feature branch following the project's branching strategy.

  Steps:
  1. Ensure you're on main and it's up to date
  2. Create a new feature branch with proper naming convention
  3. Confirm the branch is created and ready for development

  Branch naming conventions:
  - feature/step{N}-{description} - for new features/steps
  - fix/{description} - for bug fixes
  - refactor/{description} - for refactoring
  - docs/{description} - for documentation updates

  Usage:
  - Ask the user for the branch name/description
  - Run: git checkout main
  - Run: git pull origin main
  - Run: git checkout -b {branch-name}
  - Confirm: Show git status and current branch
  - Remind: CI will check tests, lint, and build on PR
