<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>TicTrack - Presentation Slides</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: #000;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }

    /* ── Slide container ── */
    .deck {
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    .slide {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 60px 80px;
      background: hsl(42, 45%, 97%);
      opacity: 0;
      transition: opacity 0.6s ease;
      pointer-events: none;
    }
    .slide.active {
      opacity: 1;
      pointer-events: auto;
    }

    /* ── Background decoration (shared) ── */
    .slide::before,
    .slide::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: hsl(145, 25%, 52%);
      opacity: 0.07;
    }
    .slide::before {
      width: 420px;
      height: 420px;
      top: -140px;
      right: -100px;
    }
    .slide::after {
      width: 320px;
      height: 320px;
      bottom: -120px;
      left: -80px;
    }

    /* ── Slide 1: Title ── */
    .slide-title .logo {
      font-size: 108px;
      font-weight: 700;
      color: hsl(145, 25%, 42%);
      letter-spacing: -2px;
      line-height: 1;
    }
    .slide-title .tagline {
      font-size: 26px;
      color: hsl(145, 15%, 35%);
      margin-top: 20px;
    }
    .slide-title .badge {
      display: inline-block;
      background: hsl(145, 25%, 52%);
      color: #fff;
      padding: 10px 28px;
      border-radius: 28px;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.5px;
      margin-top: 28px;
    }

    /* ── Slide 2 & 3: Story ── */
    .story-icon {
      font-size: 80px;
      line-height: 1;
      position: relative;
      z-index: 1;
    }
    .story-headline {
      font-size: 36px;
      font-weight: 700;
      color: hsl(145, 15%, 28%);
      line-height: 1.3;
      margin-top: 28px;
      max-width: 700px;
      position: relative;
      z-index: 1;
    }
    .story-body {
      font-size: 22px;
      color: hsl(145, 10%, 45%);
      line-height: 1.6;
      margin-top: 20px;
      max-width: 640px;
      position: relative;
      z-index: 1;
    }

    /* ── Progress indicator ── */
    .progress {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 10;
    }
    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: hsl(145, 20%, 78%);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: hsl(145, 25%, 42%);
      transform: scale(1.3);
    }

    /* ── Keyboard hint ── */
    .hint {
      position: fixed;
      bottom: 32px;
      right: 40px;
      font-size: 13px;
      color: hsl(145, 15%, 65%);
      z-index: 10;
    }
  </style>
</head>
<body>
  <div class="deck">
    <!-- Slide 1: Title -->
    <div class="slide slide-title active" data-index="0">
      <div class="logo">TicTrack</div>
      <div class="tagline">Track and analyze tic symptoms</div>
      <div class="badge">Daily Life Enhancement</div>
    </div>

    <!-- Slide 2: My Story -->
    <div class="slide" data-index="1">
      <div class="story-icon">👨‍👦</div>
      <div class="story-headline">Built by a parent, for parents.</div>
      <div class="story-body">Inspired by my son's tic symptoms and the struggle to keep track of them.</div>
    </div>

    <!-- Slide 3: The Problem -->
    <div class="slide" data-index="2">
      <div class="story-icon">🌍</div>
      <div class="story-headline">1 in 5 children experience tics.</div>
      <div class="story-body">Yet there are almost no tools to support caregivers.</div>
    </div>
  </div>

  <!-- Progress dots -->
  <div class="progress">
    <div class="dot active"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>

  <script>
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    let current = 0;

    function goTo(n) {
      if (n < 0) return;
      if (n >= slides.length) n = 0;
      slides[current].classList.remove('active');
      dots[current].classList.remove('active');
      current = n;
      slides[current].classList.add('active');
      dots[current].classList.add('active');
    }

    // Keyboard: ← → Space Enter
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'Enter') {
        e.preventDefault();
        goTo(current + 1);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        goTo(current - 1);
      }
    });

    // Click: left half = prev, right half = next
    document.addEventListener('click', (e) => {
      if (e.clientX < window.innerWidth / 2) {
        goTo(current - 1);
      } else {
        goTo(current + 1);
      }
    });
  </script>
</body>
</html>
